# 재사용 워크플로: PR의 출발(head) → 도착(base) 브랜치 조합이 브랜치 전략에 맞는지 검사한다.
# 각 레포의 .github/workflows/branch-policy.yml 이 이 파일을 호출한다.
name: branch-policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: 브랜치 조합 검사
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          VER='v[0-9]+\.[0-9]+\.[0-9]+'
          WORK='(feat|fix|refactor|chore|docs|test|style|perf|ci|build)/[A-Za-z0-9._/-]+'

          echo "PR: ${HEAD_REF} → ${BASE_REF}"

          fail() {
            echo "::error::$1"
            echo ""
            echo "허용되는 PR 방향"
            echo "  작업 브랜치(feat/*, fix/* ...) → feature/vX.Y.Z"
            echo "  feature/vX.Y.Z                → release/vX.Y.Z (같은 버전)"
            echo "  release/vX.Y.Z, hotfix/vX.Y.Z → ${DEFAULT_BRANCH}"
            echo "  ${DEFAULT_BRANCH} (백머지)            → feature/vX.Y.Z, release/vX.Y.Z"
            exit 1
          }

          # 1) main 으로 가는 PR
          if [[ "$BASE_REF" == "$DEFAULT_BRANCH" ]]; then
            [[ "$HEAD_REF" =~ ^(release|hotfix)/${VER}$ ]] \
              || fail "${DEFAULT_BRANCH} 에는 release/vX.Y.Z 또는 hotfix/vX.Y.Z 만 PR 할 수 있습니다."
            echo "OK"; exit 0
          fi

          # 2) release 브랜치로 가는 PR
          if [[ "$BASE_REF" == release/* ]]; then
            [[ "$BASE_REF" =~ ^release/${VER}$ ]] \
              || fail "release 브랜치 이름은 release/vX.Y.Z 형식이어야 합니다. (현재: ${BASE_REF})"
            version="${BASE_REF#release/}"
            [[ "$HEAD_REF" == "feature/${version}" || "$HEAD_REF" == "$DEFAULT_BRANCH" ]] \
              || fail "${BASE_REF} 에는 feature/${version} 또는 ${DEFAULT_BRANCH}(백머지) 만 PR 할 수 있습니다."
            echo "OK"; exit 0
          fi

          # 3) feature 브랜치로 가는 PR
          if [[ "$BASE_REF" == feature/* ]]; then
            [[ "$BASE_REF" =~ ^feature/${VER}$ ]] \
              || fail "feature 브랜치 이름은 feature/vX.Y.Z 형식이어야 합니다. (현재: ${BASE_REF})"
            [[ "$HEAD_REF" =~ ^${WORK}$ || "$HEAD_REF" == "$DEFAULT_BRANCH" ]] \
              || fail "${BASE_REF} 에는 작업 브랜치(feat/*, fix/* 등) 또는 ${DEFAULT_BRANCH}(백머지) 만 PR 할 수 있습니다."
            echo "OK"; exit 0
          fi

          # 4) 그 외(작업 브랜치끼리 등)는 제한 없음
          echo "OK (제한 없는 대상 브랜치)"
